syntax = "proto3";

option go_package = "GoKeyMux/proto/pb";

package GoKeyMux;

message keyInput {
  string key = 1;
  bool isRune = 2;
  bool isPressed = 3;
}

message keyReturn {
  bool isAllDone = 1;
  string metaData = 2;
}

message keyInputDebug {
  string key = 1;
  bool isRune = 2;
  bool isPressed = 3;
  string timeStamp = 4;
  string metaData = 5;
}

message keyReturnDebug {
  bool isFinished = 1;
  string key = 2;
  string timeStamp = 3;
}

service rpcKeyService {
  rpc keyService (stream keyInput) returns (keyReturn);
  rpc keyServiceDebug (keyInputDebug) returns (keyReturnDebug);
}